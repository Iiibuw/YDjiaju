<style>html,body{height:100%}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#1f2937}#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:.7rem 1.3rem;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .3s;z-index:300}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}.modal.show{display:flex}.act-btn{cursor:pointer;padding:.25rem .6rem;border-radius:6px;font-size:.8rem;transition:all .15s}.act-edit{color:#1677ff}.act-edit:hover{background:#e6f0ff}.act-del{color:#ef4444}.act-del:hover{background:#fee2e2}.act-add{color:#16a34a}.act-add:hover{background:#dcfce7}.side-item{cursor:pointer;display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-radius:8px;color:#cbd5e1;font-size:.9rem;transition:all .15s}.side-item:hover{background:#1e293b;color:#fff}.side-item.active{background:#1677ff;color:#fff}.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:1.1rem 1.3rem}.kpi{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:1.1rem}.btn-primary{background:#1677ff;color:#fff;font-weight:500;transition:all .15s}.btn-primary:hover{background:#4096ff}.btn-line{border:1px solid #d1d5db;color:#374151;transition:all .15s}.btn-line:hover{border-color:#1677ff;color:#1677ff}table{width:100%;border-collapse:collapse;font-size:.85rem}th{text-align:left;color:#6b7280;font-weight:500;padding:.6rem .8rem;border-bottom:1px solid #e5e7eb;background:#fafafa}td{padding:.6rem .8rem;border-bottom:1px solid #f1f5f9}tr:hover td{background:#f8fafc}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#drawerBox{position:fixed;inset:0;z-index:210;display:none}
#drawerBox.show{display:block}
#drawerOverlay{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#drawerPanel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:480px;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}

#userDropdownMenu .divider{height:1px;background:#e5e7eb;margin:0 .5rem}

</div>

<div id="modalBox" class="modal" onclick="if(event.target===this)closeModalBox()"><div class="bg-white rounded-xl w-full max-w-lg p-6" id="modalInner"></div></div>
<div id="drawerBox"><div id="drawerOverlay" onclick="closeDrawer()"></div><div id="drawerPanel"><div id="drawerHead"><h3 class="font-semibold text-lg" id="drawerTitle">新增</h3><button class="text-slate-400 hover:text-slate-600" onclick="closeDrawer()">✕</button></div><div id="drawerBody"></div><div id="drawerFoot"><button class="btn-primary w-full py-2.5 rounded-lg" id="drawerSaveBtn">保存</button></div></div></div>

<script>

/* ===== 数据（原型数据驱动，非服务端强制） ===== */

  case:[{id:1,title:'城芯平层·胡桃禮客厅',space:'客厅',style:'现代简约',products:[{series:'胡桃禮',cat:'沙发',model:'HL-SF-01'},{series:'胡桃禮',cat:'几',model:'HL-CJ-02'}],created:'2026-08-10',updated:'2026-08-15'},{id:2,title:'院墅·柏悦主卧',space:'卧室',style:'新中式',products:[{series:'柏悦',cat:'床',model:'BY-BD-02'}],created:'2026-08-11',updated:'2026-08-16'}],
  news:[{id:1,title:'YD 2026 春季新品发布会圆满落幕',cat:'企业新闻',status:'已发布',content:'本次发布会以"温润生活"为主题，发布胡桃禮、柏悦两大系列新品，现场展示了多款黑胡桃实木家具，并公布年度空间定制计划。',publishTime:'2026-08-10 09:30'},{id:2,title:'实木家居消费趋势报告',cat:'行业资讯',status:'已发布',content:'行业数据显示，消费者对空间定制与环保材质的需求持续上升，定制化成为主流，线上咨询量同比增长 38%。',publishTime:'2026-08-05 14:20'}],
  recruit:[{id:1,title:'实木家具结构设计师',type:'社招',dept:'研发设计',status:'招聘中',startTime:'2026-08-01',endTime:'2026-09-30'},{id:2,title:'管培生（设计方向）',type:'校招',dept:'管培',status:'招聘中',startTime:'2026-08-15',endTime:'2026-10-15'}],
  about:[{id:1,block:'关于YD'},{id:2,block:'发展历程'},{id:3,block:'品牌介绍'},{id:4,block:'联系我们'}],
  booking:[{id:1,name:'王女士',phone:'138****0001',type:'到店预约',status:'待跟进',from:'首页',time:'2026-08-17 10:00'},{id:2,name:'李先生',phone:'139****0002',type:'产品咨询',status:'跟进中',from:'产品详情',time:'2026-08-16 15:30'}],
  message:[{id:1,name:'张同学',source:'招聘投递',content:'咨询校招简历投递方式',status:'待处理',msgTime:'2026-08-17 14:20',replyTime:'',conv:[{role:'user',text:'咨询校招简历投递方式',time:'2026-08-17 14:20'}]},{id:2,name:'赵先生',source:'客服留言',content:'沙发能否定制尺寸',status:'已回复',msgTime:'2026-08-16 10:05',replyTime:'2026-08-16 11:30',conv:[{role:'user',text:'沙发能否定制尺寸',time:'2026-08-16 10:05'},{role:'staff',text:'支持定制尺寸，客服将与您确认具体规格与报价',time:'2026-08-16 11:30'}]}],
  order:[{id:1,no:'YD20260812001',user:'会员0001',amount:12800,status:'已付款'},{id:2,no:'YD20260811002',user:'会员0002',amount:8800,status:'待付款'}]
};
/* 下拉框选项（#65 表单字段统一使用下拉框） */
const SELECTS={
  carousel:{pos:['首页','案例详情','新闻'],link:['产品','案例','新闻'],on:['是','否']},
  product:{status:['在售','下架','预售','缺货'],publish:['已发布','草稿']},
  news:{cat:['企业新闻','行业资讯'],status:['已发布','草稿','待审核']},
  recruit:{type:['社招','校招'],dept:['研发设计','管培','销售','运营'],status:['招聘中','暂停','已关闭']},
  booking:{type:['到店预约','产品咨询','定制需求','其它'],status:['待跟进','跟进中','已成交','已关闭'],from:['首页','产品详情','案例','新闻']},
  message:{source:['招聘投递','客服留言','产品咨询','售后'],status:['待处理','已回复','已关闭']},
  order:{status:['待付款','已付款','已发货','运输中','已签收','已取消']}
};
/* 长文本字段用多行文本框（#64 新闻正文 / #63 产品描述） */
const TEXTAREAS={news:['content'],product:['desc']};
/* 只读字段（#63 产品 发布状态/有效期/创建时间/修改时间 固定不可改） */
const READONLY={product:['publish','created','updated'],recruit:['startTime']};
const TABLE_CFG={
  carousel:{cols:[['img','图片'],['title','标题'],['pos','位置'],['link','跳转类型'],['series','系列'],['cat','类别'],['model','型号'],['sort','排序'],['on','启用']],ops:true},
  product:{cols:[['series','系列'],['cat','类别'],['model','型号'],['desc','描述'],['img','图片'],['price','售价'],['cost','成本'],['status','状态'],['publish','发布状态'],['validTo','有效期'],['created','创建时间'],['updated','修改时间']],ops:true},
  case:{cols:[['title','案例'],['space','空间'],['style','风格'],['products','所含产品'],['created','创建时间'],['updated','修改时间']],ops:true},
  news:{cols:[['title','标题'],['cat','分类'],['content','内容'],['status','状态'],['publishTime','发布时间']],ops:true},
  recruit:{cols:[['title','岗位'],['type','类型'],['dept','部门'],['location','地点'],['salaryMin','月薪下限(元)'],['salaryMax','月薪上限(元)'],['status','状态'],['startTime','开始时间'],['endTime','截止时间']],ops:true},
  about:{cols:[['block','区块']],ops:true},
  booking:{cols:[['name','姓名'],['phone','电话'],['type','需求类型'],['status','状态'],['from','来源'],['time','预约时间']],ops:true},
  message:{cols:[['name','姓名'],['source','来源'],['content','内容'],['status','状态'],['msgTime','留言时间'],['replyTime','回复时间']],ops:true},
  order:{cols:[['no','订单号'],['user','用户'],['amount','金额'],['status','状态']],ops:true}
};
let currentRole=null,currentMod='dashboard',currentSearch='';
let ADMIN_TOKEN='';
let ADMIN_USERNAME='';

/* ===== 后端 API 配置（同源代理，由演示服务器转发到 :8000） ===== */
const API_BASE = (window.__YD_API_BASE__) || '/api/v1';

/* ===== 真实数据层（9 个模块接后端：完整 CRUD / 状态流转 / 回复） ===== */
const REMOTE_MODS = ['product', 'case', 'news', 'carousel', 'recruit', 'booking', 'message', 'order', 'about'];
const REMOTE_PATH = {
  product: '/admin/products', case: '/admin/cases', news: '/admin/news',
  carousel: '/admin/banners', recruit: '/admin/jobs', booking: '/admin/appointments',
  message: '/admin/messages', order: '/admin/orders', about: '/admin/about-sections',
};
// 操作类型：full=完整 CRUD（新增/编辑/删除）；status=仅状态流转；reply=回复+删除；about=区块维护
const OP_TYPE = {
  product: 'full', case: 'full', news: 'full', carousel: 'full', recruit: 'full',
  booking: 'status', order: 'status', message: 'reply', about: 'about',
};
let CATS_ALL = []; // 分类列表（series/space/category）
let REMOTE_ITEMS = {}; // mod -> rows（后端原始）

async function apiGet(path, params){
  try{
    const qs = params ? '?' + new URLSearchParams(Object.entries(params).filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>[k,String(v)])) : '';
    const r = await fetch(API_BASE + path + qs, {headers: {'Authorization': 'Bearer ' + ADMIN_TOKEN}});
    const j = await r.json();
    return (j && j.code === 0) ? j.data : null;
  }catch(e){ return null; }
}
async function apiSend(method, path, body){
  try{
    const r = await fetch(API_BASE + path, {
      method, headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_TOKEN},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    return j;
  }catch(e){ return {code: 500, detail: '网络错误：' + e.message}; }
}
async function loadCats(){
  if(CATS_ALL.length) return;
  const d = await apiGet('/admin/categories');
  if(Array.isArray(d)) CATS_ALL = d;
}
function catIdByName(kind, name){
  if(!name) return null;
  const c = CATS_ALL.find(x => x.kind === kind && x.name === name);
  return c ? c.id : null;
}
function catNameById(kind, id){
  if(!id) return '';
  const c = CATS_ALL.find(x => x.kind === kind && x.id === id);
  return c ? c.name : '';
}
function fmtDate(s){
  if(!s) return '';
  return String(s).slice(0,10);
}
function fmtMoney(cents){
  if(cents === null || cents === undefined) return 0;
  return Math.round(cents / 100);
}
/* 后端行 → 原型行（供现有表格渲染） */
function remoteToProto(mod, it){
  if(mod === 'product'){
    const series = catNameById('series', it.series_id);
    const cat = catNameById('category', it.category_id);
    return {
      id: it.id, series: series || (it.subtitle || '').split('·')[0]?.trim() || '—', cat: cat || '—',
      model: it.product_code || '—', desc: it.description || '', img: it.cover_url || '',
      price: fmtMoney(it.min_price_cents), cost: 0,
      status: it.status === 'on_sale' ? '在售' : (it.status === 'off_sale' ? '下架' : '草稿'),
      publish: it.status === 'draft' ? '草稿' : '已发布',
      validTo: it.publish_end_at ? fmtDate(it.publish_end_at) : '—',
      created: fmtDate(it.created_date), updated: fmtDate(it.updated_date),
      __raw: it,
    };
  }
  if(mod === 'case'){
    return {
      id: it.id, title: it.title, space: '—', style: it.style || '—',
      products: it.description ? [{series: it.style || '', cat: '', model: it.description.slice(0, 30)}] : [],
      created: fmtDate(it.published_date), updated: '',
      __raw: it,
    };
  }
  // news
  if(mod === 'news'){
    return {
      id: it.id, title: it.title, cat: it.category === 'company' ? '企业新闻' : '行业资讯',
      content: it.summary || it.content || '', status: it.is_published ? '已发布' : '草稿',
      publishTime: it.published_date ? String(it.published_date).slice(0,16).replace('T',' ') : '',
      __raw: it,
    };
  }
  // carousel（banners）
  if(mod === 'carousel'){
    return {
      id: it.id, title: it.title, pos: it.link_type || '', link: it.link_target || '',
      series: '', cat: '', model: '', sort: it.sort || 0,
      on: it.is_activate === 1 || it.is_activate === true ? '是' : '否',
      img: it.image_url || '', __raw: it,
    };
  }
  // recruit（jobs）
  if(mod === 'recruit'){
    return {
      id: it.id, title: it.title, type: it.category === 'campus' ? '校招' : '社招',
      dept: it.department || '—', status: it.is_activate === false ? '已关闭' : '招聘中',

}

    };
  }
  return {};

/* ===== 登录（接真实后端：验证码 → 登录 → 写入 token） ===== */
async function refreshCaptcha(){
  const cid = 'c_' + Math.random().toString(36).slice(2, 12);
  try{
    const r = await fetch(API_BASE + '/auth/captcha?captcha_id=' + cid);
    const j = await r.json();
    if(j && j.code === 0 && j.data && j.data.captcha_id){
      window.__captcha_id__ = j.data.captcha_id;
      const img = document.getElementById('acaptchaImg');
      // 优先用图片直连端点（沙箱会 wrap base64 为 blob ref，直连最稳）
      img.src = API_BASE + '/auth/captcha-image/' + j.data.captcha_id + '?t=' + Date.now();
      img.onerror = function(){ img.src = j.data.captcha_image || ''; };
    }
  }catch(err){
    const img = document.getElementById('acaptchaImg');
    if(img) img.title = '后端未连通：' + err.message;
  }
}

async function doLogin(e){
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  const u = document.getElementById('au').value.trim();
  const p = document.getElementById('ap').value.trim();
  const code = document.getElementById('acode').value.trim();
  const cid = window.__captcha_id__ || ('c_' + Math.random().toString(36).slice(2,10));
  try{
    const r = await fetch(API_BASE + '/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p, captcha_id: cid, captcha_code: code}),
    });
    const j = await r.json();
    if(j && j.code === 0 && j.data && j.data.access_token){
      ADMIN_TOKEN = j.data.access_token;
      ADMIN_USERNAME = u;
      const roleKey = ROLES[u] ? u : 'admin';
      currentRole = ROLES[roleKey];
      sessionStorage.setItem('yd_admin_logged','1');
      sessionStorage.setItem('yd_admin_role',roleKey);
      sessionStorage.setItem('yd_admin_token',ADMIN_TOKEN);
      localStorage.setItem('yd_admin_logged','1');
      localStorage.setItem('yd_admin_role',roleKey);
      enterApp();
    }else{
      errEl.textContent = '登录失败：' + (j.detail || j.message || JSON.stringify(j));
      errEl.classList.remove('hidden');
      refreshCaptcha();
    }
  }catch(err){
    errEl.textContent = '请求失败：' + err.message + '\n请确认后端服务运行于 ' + API_BASE;
    errEl.classList.remove('hidden');
  }
  return false;
}

function seedStats(){
  const days=['周一','周二','周三','周四','周五','周六','周日'];
  const visits=days.map((_,i)=>800+i*173+(i%2?120:0));
  const sales=days.map((_,i)=>3+i*1+(i%3?0:2));
  const totalVisit=visits.reduce((a,b)=>a+b,0);
  return {days,visits,sales,totalVisit,bookings:DB.booking.length,msgs:DB.message.length,orders:DB.order.length,salesSum:sales.reduce((a,b)=>a+b,0)*1000};
}

      <div class="card"><h3 class="font-semibold text-slate-700 mb-3">近 7 日订单量（真实）</h3><svg viewBox="0 0 440 180" class="w-full h-[180px]"><polyline points="${linePts}" fill="none" stroke="#1677ff" stroke-width="2.5"/><polyline points="20,160 ${400},160" stroke="#e5e7eb" stroke-width="1"/>${days.map((d,i)=>`<circle cx="${i*60+20}" cy="${160-Math.round(orderVals[i]/maxO*130)}" r="3" fill="#1677ff"/><text x="${i*60+20}" y="${160-Math.round(orderVals[i]/maxO*130)-8}" font-size="9" fill="#6b7280" text-anchor="middle">${orderVals[i]||0}</text><text x="${i*60+20}" y="176" font-size="9" fill="#6b7280" text-anchor="middle">${d.slice(5)}</text>`).join('')}</svg></div>
    </div>`;
    return;
  }
  const s = seedStats();
  const maxV=Math.max(...s.visits);
  const bars=s.days.map((d,i)=>{const h=Math.round(s.visits[i]/maxV*140);return `<div class="flex flex-col items-center gap-1"><div class="text-[10px] text-slate-500">${s.visits[i]}</div><div class="w-7 rounded-t bg-primary" style="height:${h}px"></div><div class="text-[11px] text-slate-500">${d}</div></div>`;}).join('');
  const maxS=Math.max(...s.sales);
  const linePts=s.sales.map((v,i)=>`${(i*60+20).toFixed(0)},${(160-Math.round(v/maxS*130)).toFixed(0)}`).join(' ');
  c.innerHTML=`<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    ${kpi('访问量(PV/UV)',s.totalVisit.toLocaleString())}${kpi('预约量',s.bookings)}${kpi('留言量',s.msgs)}${kpi('订单量',s.orders)}${kpi('销售额(趋势)',s.salesSum.toLocaleString())}
  </div>
  <div class="grid md:grid-cols-2 gap-4">
    <div class="card"><h3 class="font-semibold text-slate-700 mb-3">近 7 日访问量</h3><div class="flex items-end justify-between gap-2 h-[180px]">${bars}</div></div>
    <div class="card"><h3 class="font-semibold text-slate-700 mb-3">销售额趋势（万元）</h3><svg viewBox="0 0 440 180" class="w-full h-[180px]"><polyline points="${linePts}" fill="none" stroke="#1677ff" stroke-width="2.5"/><polyline points="20,160 ${400},160" stroke="#e5e7eb" stroke-width="1"/>${s.sales.map((v,i)=>`<circle cx="${i*60+20}" cy="${160-Math.round(v/maxS*130)}" r="3" fill="#1677ff"/><text x="${i*60+20}" y="${160-Math.round(v/maxS*130)-8}" font-size="9" fill="#6b7280" text-anchor="middle">${v}</text><text x="${i*60+20}" y="176" font-size="9" fill="#6b7280" text-anchor="middle">${s.days[i]}</text>`).join('')}</svg></div>
  </div>`;
}

async function loadSysRoles(){
  const d = await apiGet('/admin/roles', {page: 1, page_size: 100});
  SYS_ROLES = (d && Array.isArray(d.items)) ? d.items : [];
  return SYS_ROLES;
}
async function loadSysPerms(){
  const d = await apiGet('/admin/permissions');
  if(d && typeof d === 'object'){
    const flat = [];
    Object.entries(d).forEach(([mod, arr]) => {
      if(Array.isArray(arr)) arr.forEach(p => flat.push(Object.assign({}, p, {_module: mod})));
    });
    SYS_PERMS = flat;
  }
  return SYS_PERMS;
}
async function loadSysUsers(){
  const d = await apiGet('/admin/users', {page: 1, page_size: 100});
  SYS_USERS = (d && Array.isArray(d.items)) ? d.items : [];
  return SYS_USERS;
}

async function saveUser(id){
  if(id === null){
    const payload = {
      username: document.getElementById('uName').value.trim(),
      password: document.getElementById('uPwd').value,
      real_name: document.getElementById('uReal').value.trim() || null,
      role_id: +document.getElementById('uRole').value || null,
      data_scope: document.getElementById('uScope').value,
      is_activate: 1,
    };
    if(!payload.username || !payload.password || payload.password.length < 6){ toast('请填写账号与 ≥6 位密码'); return; }
    const j = await apiSend('POST', '/admin/users', payload);
    closeModalBox();
    if(j && j.code === 0){ toast('管理员已创建'); renderSysUsers(); }
    else toast('创建失败：' + (j.detail || j.message || '请重试'));
  } else {
    const payload = {
      real_name: document.getElementById('uReal').value.trim() || null,
      role_id: +document.getElementById('uRole').value || null,
      data_scope: document.getElementById('uScope').value,
      is_activate: 1,
    };
    const j = await apiSend('PUT', '/admin/users/' + id, payload);
    closeModalBox();
    if(j && j.code === 0){ toast('管理员已保存'); renderSysUsers(); }
    else toast('保存失败：' + (j.detail || j.message || '请重试'));
  }
}

/* ===== 字段渲染（下拉框 / 多行文本 / 图片上传 / 只读 / 数组） ===== */
let pendingImg='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imgField(cur){return `<label class="block text-sm text-slate-500 mb-1">图片（点击上传，本地预览）</label><input type="file" accept="image/*" id="upImg" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-2" onchange="previewImg(this)"><div id="imgPrev" class="mb-3">${cur?`<img src="${cur}" class="h-24 rounded-lg border">`:'<span class="text-xs text-slate-400">尚未上传</span>'}</div>`;}
function previewImg(input){const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{pendingImg=rd.result;document.getElementById('imgPrev').innerHTML=`<img src="${pendingImg}" class="h-24 rounded-lg border">`;};rd.readAsDataURL(f);}
function productUrl(series,cat,model){return `prototype_产品详情_YD家具.html?series=${encodeURIComponent(series||'')}&cat=${encodeURIComponent(cat||'')}&model=${encodeURIComponent(model||'')}`;}
function fmtProductCell(prods){if(!Array.isArray(prods)||!prods.length)return '<span class="text-slate-300">—</span>';return prods.map(p=>`<span class="inline-block bg-slate-100 text-slate-600 rounded px-2 py-0.5 text-xs mr-1 mb-1">${esc(p.series+' · '+p.cat+' · '+p.model)}</span>`).join('');}
function fieldHTML(mod,c,r,isAdd){
  const key=c[0];
  if(isAdd&&READONLY[mod]&&READONLY[mod].includes(key))return '';
  if(key==='img')return imgField(r?r.img:'');
  if(key==='products')return caseProductsField(r?r.products:[]);
  if(mod==='product'&&(key==='series'||key==='cat')){
    const kind=key==='series'?'series':'category';
    const opts=CATS_ALL.filter(x=>x.kind===kind).map(x=>x.name);
    const cur=r?(key==='series'?r.series:r.cat):'';
    return `<label class="block text-sm text-slate-500 mb-1">${c[1]}</label><select data-f="${key}" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none"><option value="">（不选）</option>${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  if(TEXTAREAS[mod]&&TEXTAREAS[mod].includes(key))return `<label class="block text-sm text-slate-500 mb-1">${c[1]}</label><textarea data-f="${key}" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none" rows="4">${r?esc(r[key]||''):''}</textarea>`;
  if(SELECTS[mod]&&SELECTS[mod][key]){const opts=SELECTS[mod][key];const cur=r?r[key]:opts[0];return `<label class="block text-sm text-slate-500 mb-1">${c[1]}</label><select data-f="${key}" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none">${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;}
  if(READONLY[mod]&&READONLY[mod].includes(key))return `<label class="block text-sm text-slate-500 mb-1">${c[1]}（只读）</label><input data-f="${key}" value="${r?esc(r[key]||''):''}" disabled class="w-full border border-slate-200 bg-slate-50 rounded-lg px-3 py-2 mb-3 text-slate-400">`;
  if(mod==='recruit'&&key==='startTime'&&!r)return `<label class="block text-sm text-slate-500 mb-1">开始时间（只读）</label><input data-f="startTime" value="${new Date().toISOString().slice(0,10)}" disabled class="w-full border border-slate-200 bg-slate-50 rounded-lg px-3 py-2 mb-3 text-slate-400">`;
  if(mod==='recruit'&&key==='endTime')return `<label class="block text-sm text-slate-500 mb-1">${c[1]}</label><input type="date" data-f="${key}" value="${r?esc(r[key]||''):''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none">`;
  const val=r?(r[key]===true?'是':r[key]===false?'否':esc(r[key]??'')):'';
  return `<label class="block text-sm text-slate-500 mb-1">${c[1]}</label><input data-f="${key}" value="${val}" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none">`;
}
function caseProductsField(prods){let html='<label class="block text-sm text-slate-500 mb-1">所含产品（系列 / 类别 / 型号）</label><div id="caseProds">';prods.forEach((p,i)=>{html+=`<div class="flex gap-2 mb-2 case-prod-row"><input data-prod="${i}" data-key="series" value="${esc(p.series||'')}" placeholder="系列" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><input data-prod="${i}" data-key="cat" value="${esc(p.cat||'')}" placeholder="类别" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><input data-prod="${i}" data-key="model" value="${esc(p.model||'')}" placeholder="型号" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><button type="button" onclick="removeCaseProd(${i})" class="text-red-500 text-xs px-2">删</button></div>`;});html+='</div><button type="button" onclick="addCaseProd()" class="text-sm text-primary hover:underline mb-3">+ 添加产品</button>';return html;}
let caseProdsCache=[];
function addCaseProd(){caseProdsCache.push({series:'',cat:'',model:''});document.getElementById('caseProds').insertAdjacentHTML('beforeend',`<div class="flex gap-2 mb-2 case-prod-row"><input data-prod="${caseProdsCache.length-1}" data-key="series" placeholder="系列" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><input data-prod="${caseProdsCache.length-1}" data-key="cat" placeholder="类别" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><input data-prod="${caseProdsCache.length-1}" data-key="model" placeholder="型号" class="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"><button type="button" onclick="removeCaseProd(${caseProdsCache.length-1})" class="text-red-500 text-xs px-2">删</button></div>`);}
function removeCaseProd(i){caseProdsCache.splice(i,1);const p=document.querySelector('#caseProds').parentElement;const mod=document.getElementById('drawerBox').classList.contains('show')?'case':null;if(mod){const container=document.getElementById('drawerBody');container.querySelector('#caseProds').outerHTML=caseProductsField(caseProdsCache);}}
function readCaseProds(){const rows=[];document.querySelectorAll('.case-prod-row').forEach(row=>{const o={};row.querySelectorAll('input').forEach(inp=>{o[inp.dataset.key]=inp.value.trim();});if(o.series||o.model)rows.push(o);});return rows;}

/* ===== 右侧抽屉新增 ===== */
let drawerMod='';
function openAdd(mod){
  drawerMod=mod;
  if(mod==='carousel'||mod==='product')pendingImg='';
  if(mod==='case')caseProdsCache=[];
  if(mod==='about'){
    showModal(`<h3 class="font-semibold text-lg mb-3">新增关于区块</h3>
      <label class="block text-sm text-slate-500 mb-1">区块标识（code）</label>
      <input id="aboutCode" value="about-yd" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none" placeholder="about-yd / history / brand / contact">
      <label class="block text-sm text-slate-500 mb-1">标题</label>
      <input id="aboutTitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none">
      <label class="block text-sm text-slate-500 mb-1">副标题</label>
      <input id="aboutSubtitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none">
      <label class="block text-sm text-slate-500 mb-1">正文（HTML 支持）</label>
      <textarea id="aboutBody" rows="6" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:border-primary focus:outline-none"></textarea>
      <div class="flex gap-2 justify-end"><button class="btn-line px-4 py-2 rounded-lg" onclick="closeModalBox()">取消</button><button class="btn-primary px-4 py-2 rounded-lg" onclick="createAbout()">创建</button></div>`);
    return;
  }
  const render=()=>{const cfg=TABLE_CFG[mod];let fields='';cfg.cols.forEach(c=>{fields+=fieldHTML(mod,c,null,true);});document.getElementById('drawerTitle').textContent='新增'+MOD_LABEL[mod];document.getElementById('drawerBody').innerHTML=`<div id="addForm">${fields}</div>`;document.getElementById('drawerSaveBtn').onclick=()=>saveAdd(mod);document.getElementById('drawerBox').classList.add('show');};
  if(mod==='product'){loadCats().then(render);}else{render();}
}
async function createAbout(){
  const payload = {
    code: document.getElementById('aboutCode').value.trim() || 'about-yd',
    title: document.getElementById('aboutTitle').value.trim(),
    subtitle: document.getElementById('aboutSubtitle').value.trim() || null,
    body: document.getElementById('aboutBody').value || null,
    sort: 0, is_activate: 1, images: [],
  };
  if(!payload.title){ toast('请填写区块标题'); return; }
  const j = await apiSend('POST', REMOTE_PATH.about, payload);
  closeModalBox();
  if(j && j.code === 0){ toast('已新增，前台刷新可见'); refreshRemote('about'); }
  else { toast('新增失败：' + (j.detail || j.message || '请重试')); }
}
/* 状态流转（booking/order） */
function openStatus(mod, id){
  const stOpts = mod === 'order'
    ? [['paid','已付款'],['shipped','已发货'],['completed','已完成'],['closed','已取消']]
    : [['following','跟进中'],['converted','已成交'],['invalid','已关闭']];
  showModal(`<h3 class="font-semibold text-lg mb-3">${MOD_LABEL[mod]} · 状态流转</h3>
    <p class="text-sm text-slate-500 mb-3">选择目标状态并保存（实时同步前端）。</p>
    <label class="block text-sm text-slate-500 mb-1">目标状态</label>
    <select id="statusSel" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:border-primary focus:outline-none">${stOpts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>
    ${mod === 'booking' ? `<label class="block text-sm text-slate-500 mb-1">跟进备注</label><input id="followNote" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:border-primary focus:outline-none">` : ''}
    <div class="flex gap-2 justify-end"><button class="btn-line px-4 py-2 rounded-lg" onclick="closeModalBox()">取消</button><button class="btn-primary px-4 py-2 rounded-lg" onclick="doStatus('${mod}',${id})">保存状态</button></div>`);
}
async function doStatus(mod, id){
  const status = document.getElementById('statusSel').value;
  const payload = mod === 'order'
    ? {status}
    : {status, follow_note: (document.getElementById('followNote') || {}).value || null};
  const j = await apiSend('PUT', REMOTE_PATH[mod] + '/' + id + '/status', payload);
  closeModalBox();
  if(j && j.code === 0){ toast('状态已更新，前台刷新可见'); refreshRemote(mod); }
  else { toast('更新失败：' + (j.detail || j.message || '请重试')); }
}
function closeDrawer(){document.getElementById('drawerBox').classList.remove('show');}
function saveAdd(mod){const cfg=TABLE_CFG[mod];const obj={id:Date.now()};cfg.cols.forEach(c=>{const key=c[0];if(READONLY[mod]&&READONLY[mod].includes(key))return;if(key==='img')return;if(key==='products'){obj.products=readCaseProds();return;}const el=document.querySelector(`#addForm [data-f="${key}"]`);if(el){let v=el.value;if(['price','cost','stock','amount','sort'].includes(key))v=+v||0;obj[key]=v;}});if(mod==='carousel'||mod==='product')obj.img=pendingImg||'';if(mod==='product'){const t=new Date().toISOString().slice(0,10);obj.publish=obj.publish||'草稿';obj.validTo=obj.validTo||'2027-12-31';obj.created=t;obj.updated=t;}if(mod==='recruit'){obj.startTime=new Date().toISOString().slice(0,10);}
  if(mod==='booking'){obj.time=new Date().toISOString().slice(0,16).replace('T',' ');}
  if(mod==='message'){obj.msgTime=new Date().toISOString().slice(0,16).replace('T',' ');obj.replyTime='';}
  if(mod==='news'){obj.publishTime=new Date().toISOString().slice(0,16).replace('T',' ');}
  if(mod==='case'){const t=new Date().toISOString().slice(0,10);obj.created=t;obj.updated=t;}
  if(REMOTE_MODS.includes(mod)){
    const payload=protoToApi(mod, obj, true);
    apiSend('POST', REMOTE_PATH[mod], payload).then(j=>{
      if(j && j.code===0){closeDrawer();toast('已新增，前台刷新可见');refreshRemote(mod);}
      else{toast('新增失败：'+(j.detail||j.message||JSON.stringify(j||{}).slice(0,90)));}
    });
    return;
  }
  DB[mod].push(obj);closeDrawer();renderTable(mod);toast('已新增');}

/* ===== 编辑抽屉 ===== */
let drawerEditId=null;
function openEdit(mod,id){const cfg=TABLE_CFG[mod];const r=(REMOTE_MODS.includes(mod)?(REMOTE_ITEMS[mod]||[]):(DB[mod]||[])).find(x=>x.id===id);if(!r)return;drawerMod=mod;drawerEditId=id;if(mod==='carousel'||mod==='product')pendingImg=r.img||'';if(mod==='case')caseProdsCache=JSON.parse(JSON.stringify(r.products||[]));let fields='';cfg.cols.forEach(c=>{fields+=fieldHTML(mod,c,r,false);});document.getElementById('drawerTitle').textContent='编辑'+MOD_LABEL[mod];document.getElementById('drawerBody').innerHTML=`<div id="editForm">${fields}</div>`;document.getElementById('drawerSaveBtn').onclick=()=>saveEdit(mod,id);document.getElementById('drawerBox').classList.add('show');}
function saveEdit(mod,id){const cfg=TABLE_CFG[mod];const srcRows=REMOTE_MODS.includes(mod)?(REMOTE_ITEMS[mod]||[]):(DB[mod]||[]);const r=srcRows.find(x=>x.id===id);if(!r)return;const proto=Object.assign({},r);cfg.cols.forEach(c=>{const key=c[0];if(READONLY[mod]&&READONLY[mod].includes(key))return;if(key==='img')return;if(key==='products'){proto.products=readCaseProds();return;}const el=document.querySelector(`#editForm [data-f="${key}"]`);if(el){let v=el.value;if(['price','cost','stock','amount','sort','salaryMin','salaryMax','headcount'].includes(key))v=+v||0;proto[key]=v;}});if(mod==='carousel'||mod==='product')proto.img=pendingImg;if(mod==='product')proto.updated=new Date().toISOString().slice(0,10);if(mod==='case')proto.updated=new Date().toISOString().slice(0,10);if(mod==='news')proto.publishTime=proto.publishTime||new Date().toISOString().slice(0,16).replace('T',' ');
  if(REMOTE_MODS.includes(mod)){
    const payload=protoToApi(mod, proto, false);
    apiSend('PUT', REMOTE_PATH[mod]+'/'+id, payload).then(j=>{
      if(j && j.code===0){closeDrawer();toast('已保存，前台刷新可见');refreshRemote(mod);}
      else{toast('保存失败：'+(j.detail||j.message||JSON.stringify(j||{}).slice(0,90)));}
    });
    return;
  }
  closeDrawer();renderTable(mod);toast('已保存');}
function openDel(mod,id){showModal(`<h3 class="font-semibold text-lg mb-3">确认删除</h3><p class="text-sm text-slate-500 mb-5">该操作不可撤销，确定删除此项？</p><div class="flex gap-2 justify-end"><button class="btn-line px-4 py-2 rounded-lg" onclick="closeModalBox()">取消</button><button class="bg-red-500 text-white px-4 py-2 rounded-lg" onclick="doDel('${mod}',${id})">删除</button></div>`);}
function doDel(mod,id){
  if(REMOTE_MODS.includes(mod)){
    apiSend('DELETE', REMOTE_PATH[mod]+'/'+id, {}).then(j=>{
      closeModalBox();
      if(j && j.code===0){toast('已删除，前台刷新可见');refreshRemote(mod);}
      else{toast('删除失败：'+(j.detail||j.message||'请重试'));}
    });
    return;
  }
  DB[mod]=DB[mod].filter(x=>x.id!==id);closeModalBox();renderTable(mod);toast('已删除');}
function openCarouselPreview(id){const r=DB.carousel.find(x=>x.id===id);if(!r)return;const url=productUrl(r.series,r.cat,r.model);showModal(`<h3 class="font-semibold text-lg mb-3">轮播图预览</h3><p class="text-sm text-stone-500 mb-2">标题：${esc(r.title)}</p><p class="text-sm text-stone-500 mb-2">跳转链接：</p><div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-4 text-xs break-all text-slate-600">${esc(url)}</div><div class="flex gap-2"><a href="${esc(url)}" target="_blank" class="btn-primary flex-1 text-center py-2 rounded-lg">打开产品页</a><button class="btn-line flex-1 py-2 rounded-lg" onclick="closeModalBox()">关闭</button></div>`);}
function openReply(id){
  const m = (REMOTE_ITEMS.message || []).find(x => x.id === id);
  if(!m) return;
  showModal(`<h3 class="font-semibold text-lg mb-3">回复留言 #${id}</h3><p class="text-sm text-slate-500 mb-2">${esc(m.name)}：${esc(m.content)}</p><textarea id="replyText" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:border-primary focus:outline-none" rows="3" placeholder="输入回复内容…"></textarea><button class="btn-primary w-full py-2.5 rounded-lg" onclick="saveReplyRemote(${id})">发送回复</button>`);
}
async function saveReplyRemote(id){
  const t = document.getElementById('replyText').value.trim();
  if(!t){ toast('请输入回复内容'); return; }
  const j = await apiSend('POST', REMOTE_PATH.message + '/' + id + '/reply', {reply_content: t});
  closeModalBox();
  if(j && j.code === 0){ toast('已回复，前台刷新可见'); refreshRemote('message'); }
  else { toast('回复失败：' + (j.detail || j.message || '请重试')); }
}
function saveReply(id){const t=document.getElementById('replyText').value.trim();if(!t){toast('请输入回复内容');return;}const m=DB.message.find(x=>x.id===id);m.status='已回复';m.reply=t;m.replyTime=new Date().toISOString().slice(0,16).replace('T',' ');m.conv.push({role:'staff',text:t,time:m.replyTime});closeModalBox();renderTable('message');toast('已回复，状态标记为「已回复」');}

/* ===== 顶部用户下拉 ===== */
function toggleUserDropdown(e){e.stopPropagation();document.getElementById('userDropdownMenu').classList.toggle('show');}
document.addEventListener('click',()=>{const d=document.getElementById('userDropdownMenu');if(d)d.classList.remove('show');});
function openChangePwd(){showModal(`<h3 class="font-semibold text-lg mb-4">修改密码</h3><label class="block text-sm text-slate-500 mb-1">原密码</label><input id="oldPwd" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none"><label class="block text-sm text-slate-500 mb-1">新密码</label><input id="newPwd" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:border-primary focus:outline-none"><button class="btn-primary w-full py-2.5 rounded-lg" onclick="saveChangePwd()">保存</button>`);}
function saveChangePwd(){const oldP=document.getElementById('oldPwd').value;const newP=document.getElementById('newPwd').value;if(oldP!=='123456'){toast('原密码错误');return;}if(!newP){toast('请输入新密码');return;}localStorage.setItem('yd_admin_pwd',newP);closeModalBox();toast('密码已修改（演示：下次登录可用新密码）');}
function openSwitchUser(){showModal(`<h3 class="font-semibold text-lg mb-4">切换账号</h3><label class="block text-sm text-slate-500 mb-1">账号</label><input id="swUser" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-3 focus:border-primary focus:outline-none" placeholder="admin / editor / product / service / order"><label class="block text-sm text-slate-500 mb-1">密码</label><input id="swPwd" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:border-primary focus:outline-none" placeholder="密码"><button class="btn-primary w-full py-2.5 rounded-lg" onclick="doSwitchUser()">切换</button>`);}
function doSwitchUser(){const u=document.getElementById('swUser').value.trim();const p=document.getElementById('swPwd').value;const savedPwd=localStorage.getItem('yd_admin_pwd');const expected=savedPwd||'123456';if(p!==expected){toast('密码错误');return;}const rk=ROLES[u]?u:'admin';currentRole=ROLES[rk];sessionStorage.setItem('yd_admin_logged','1');sessionStorage.setItem('yd_admin_role',rk);localStorage.setItem('yd_admin_logged','1');localStorage.setItem('yd_admin_role',rk);closeModalBox();enterApp();toast('已切换为 '+currentRole.name);}

/* ===== 通用 ===== */
function refreshModule(){if(currentMod==='dashboard')renderModule('dashboard');else if(REMOTE_MODS.includes(currentMod))refreshRemote(currentMod);else renderTable(currentMod,currentSearch);toast('已刷新数据');}
function doSearch(v){currentSearch=v.trim();if(currentMod!=='dashboard'&&currentMod!=='about'&&currentMod!=='system'){if(REMOTE_MODS.includes(currentMod))renderRemoteTable(currentMod);else renderTable(currentMod,currentSearch);}}
function showModal(html){document.getElementById('modalInner').innerHTML=html;document.getElementById('modalBox').classList.add('show');}
function closeModalBox(){document.getElementById('modalBox').classList.remove('show');}
function toast(t){const el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.add('hidden'),2200);}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleString('zh-CN',{hour12:false});}
setInterval(tick,1000);
function restoreAdmin(){
  const logged = sessionStorage.getItem('yd_admin_logged') || localStorage.getItem('yd_admin_logged');
  const role = sessionStorage.getItem('yd_admin_role') || localStorage.getItem('yd_admin_role');
  ADMIN_TOKEN = sessionStorage.getItem('yd_admin_token') || '';
  ADMIN_USERNAME = role || 'admin';
  if(logged === '1'){
    const rk = role || 'admin';
    if(ROLES[rk]){
      currentRole = ROLES[rk];
      enterApp();
    }
  }else{
    refreshCaptcha();
  }
}
restoreAdmin();
</script>
