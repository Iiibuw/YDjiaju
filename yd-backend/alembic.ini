# Alembic 配置。YD 家居后端迁移。

[alembic]
# 迁移脚本目录（相对于 alembic.ini 位置）
script_location = alembic

# 模板目录（生成新迁移用）
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# 时区（中国区 UTC+8）
timezone = Asia/Shanghai

# sqlalchemy.url 由 env.py 运行时从配置读取

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
