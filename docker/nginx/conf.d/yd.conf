# YD 全站反代
# 入口 8080，按 URL 前缀路由：
#  /              → frontend:80 (前台 SPA)
#  /admin         → admin:80 (后台 SPA)
#  /api           → backend:8000 (FastAPI)
#  /uploads       → backend:8000 (静态文件)

upstream yd_backend  { server backend:8000; }
upstream yd_frontend { server frontend:80; }
upstream yd_admin    { server admin:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # ===== API =====
    location /api/ {
        proxy_pass         http://yd_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ===== 上传静态文件 =====
    location /uploads/ {
        proxy_pass         http://yd_backend;
        proxy_set_header   Host $host;
    }

    # ===== 后台（注意：/admin 是后台根） =====
    location /admin/ {
        proxy_pass         http://yd_admin;
        proxy_set_header   Host $host;
    }
    location = /admin {
        return 301 /admin/;
    }

    # ===== 前台（默认） =====
    location / {
        proxy_pass         http://yd_frontend;
        proxy_set_header   Host $host;
    }

    # ===== 健康检查 =====
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
