# 后台 SPA（vite base=/admin/）
# 资源在 HTML 中以 /admin/assets/... 引用，但磁盘文件仍位于 /assets/...
# 故在此剥离 /admin 前缀后再查找静态文件；SPA 路由回退到 index.html。
server {
    listen 80;
    root /usr/share/nginx/html;

    # 后台根路径
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # 兜底（含直接访问 / 等非 /admin 前缀时回退 SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
